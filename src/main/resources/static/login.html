<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Expense Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>💰 Expense Tracker</h1>


    <form id="loginForm">

        <!-- Username -->

        <label for="username">
            Username
        </label>

        <input
                type="text"
                id="username"
                placeholder="Username"
                required
        >


        <!-- Password -->

        <label for="password">
            Password
        </label>

        <input
                type="password"
                id="password"
                placeholder="Password"
                required
        >


        <!-- Login Button -->

        <button type="submit">
            Login
        </button>

    </form>


    <!-- Message -->

    <div
            id="message"
            class="message">
    </div>


    <!-- Register Link -->

    <div class="register-link">

        Don't have an account?

        <a href="/register.html">
            Create Account
        </a>

    </div>

</div>


<script>

    /*
     * =====================================================
     * API URL
     * =====================================================
     *
     * IMPORTANT:
     *
     * Do NOT change this to localhost.
     *
     * This automatically uses your Render domain:
     *
     * https://expense-tracker-app-ckop.onrender.com
     *
     * Therefore the actual request becomes:
     *
     * https://expense-tracker-app-ckop.onrender.com/api/users/login
     *
     */

    const API_URL = "/api/users/login";


    /*
     * =====================================================
     * LOGIN FORM
     * =====================================================
     */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                /*
                 * Stop normal form submission
                 */

                event.preventDefault();


                /*
                 * Get username
                 */

                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                /*
                 * Get password
                 */

                const password =
                    document
                        .getElementById("password")
                        .value;


                /*
                 * Message element
                 */

                const message =
                    document
                        .getElementById("message");


                /*
                 * Show loading message
                 */

                message.textContent =
                    "⏳ Logging in...";

                message.style.color =
                    "#3498db";


                /*
                 * =================================================
                 * SEND LOGIN REQUEST
                 * =================================================
                 */

                try {

                    const response =
                        await fetch(
                            API_URL,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                /*
                                 * Keep cookies/session information
                                 */

                                credentials: "include",

                                body: JSON.stringify({

                                    username: username,

                                    password: password

                                })
                            }
                        );


                    /*
                     * Read Spring Boot response
                     */

                    const result =
                        await response.text();


                    console.log(
                        "Login response:",
                        response.status,
                        result
                    );


                    /*
                     * =================================================
                     * LOGIN SUCCESS
                     * =================================================
                     */

                    if (
                        response.ok &&
                        result.trim() === "Login successful"
                    ) {

                        message.textContent =
                            "✅ Login successful!";

                        message.style.color =
                            "green";


                        /*
                         * Redirect to dashboard
                         */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "/index.html";

                            },
                            500
                        );

                    }


                    /*
                     * =================================================
                     * LOGIN FAILED
                     * =================================================
                     */

                    else {

                        message.textContent =
                            "❌ " + result;

                        message.style.color =
                            "red";

                    }

                }


                    /*
                     * =================================================
                     * CONNECTION ERROR
                     * =================================================
                     */

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    message.textContent =
                        "❌ Cannot connect to server";

                    message.style.color =
                        "red";

                }

            }
        );

</script>

</body>

</html>
