<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Expense Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #3498db;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>💰 Create Account</h1>


    <form id="registerForm">

        <!-- Username -->

        <label for="username">
            Username
        </label>

        <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
        >


        <!-- Email -->

        <label for="email">
            Email
        </label>

        <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
        >


        <!-- Password -->

        <label for="password">
            Password
        </label>

        <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
        >


        <!-- Confirm Password -->

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
        >


        <!-- Register Button -->

        <button type="submit">
            Register
        </button>

    </form>


    <!-- Message -->

    <div
            id="message"
            class="message">
    </div>


    <!-- Login Link -->

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script>

    /*
     * =====================================================
     * API URL
     * =====================================================
     *
     * IMPORTANT:
     *
     * Do NOT use:
     *
     * http://localhost:8080/api/users/register
     *
     * because that will try to connect to the user's
     * computer after deployment.
     *
     * This relative URL automatically uses the current
     * Render domain.
     *
     * Example:
     *
     * https://expense-tracker-app-ckop.onrender.com
     * /api/users/register
     *
     */

    const API_URL = "/api/users/register";


    /*
     * =====================================================
     * REGISTER FORM
     * =====================================================
     */

    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async function(event) {

                /*
                 * Stop normal form submission
                 */

                event.preventDefault();


                /*
                 * =================================================
                 * GET USERNAME
                 * =================================================
                 */

                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                /*
                 * =================================================
                 * GET EMAIL
                 * =================================================
                 */

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                /*
                 * =================================================
                 * GET PASSWORD
                 * =================================================
                 */

                const password =
                    document
                        .getElementById("password")
                        .value;


                /*
                 * =================================================
                 * GET CONFIRM PASSWORD
                 * =================================================
                 */

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                /*
                 * =================================================
                 * MESSAGE ELEMENT
                 * =================================================
                 */

                const message =
                    document
                        .getElementById("message");


                /*
                 * =================================================
                 * CHECK PASSWORDS
                 * =================================================
                 */

                if (password !== confirmPassword) {

                    message.textContent =
                        "❌ Passwords do not match";

                    message.style.color = "red";

                    return;
                }


                /*
                 * =================================================
                 * SEND REQUEST TO SPRING BOOT
                 * =================================================
                 */

                try {

                    const response =
                        await fetch(
                            API_URL,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    username: username,

                                    email: email,

                                    password: password

                                })
                            }
                        );


                    /*
                     * =================================================
                     * GET SERVER RESPONSE
                     * =================================================
                     */

                    const result =
                        await response.text();


                    /*
                     * =================================================
                     * SUCCESS
                     * =================================================
                     */

                    if (response.ok) {

                        message.textContent =
                            "✅ Registration successful!";

                        message.style.color =
                            "green";


                        /*
                         * Clear form
                         */

                        document
                            .getElementById(
                                "registerForm"
                            )
                            .reset();


                        /*
                         * Redirect to login page
                         * after 1.5 seconds
                         */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1500
                        );

                    }


                    /*
                     * =================================================
                     * SERVER ERROR
                     * =================================================
                     */

                    else {

                        message.textContent =
                            "❌ " + result;

                        message.style.color =
                            "red";

                    }

                }


                    /*
                     * =================================================
                     * CONNECTION ERROR
                     * =================================================
                     */

                catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    message.textContent =
                        "❌ Cannot connect to server";

                    message.style.color =
                        "red";

                }

            }
        );

</script>

</body>

</html>
