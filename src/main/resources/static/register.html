<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Expense Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #3498db;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>💰 Create Account</h1>

    <form id="registerForm">

        <input
                type="text"
                id="username"
                placeholder="Username"
                required
        >

        <input
                type="email"
                id="email"
                placeholder="Email"
                required
        >

        <input
                type="password"
                id="password"
                placeholder="Password"
                required
        >

        <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
        >

        <button type="submit">
            Register
        </button>

    </form>


    <div
            id="message"
            class="message">
    </div>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script>

    /*
     * IMPORTANT:
     *
     * DO NOT use:
     * http://localhost:8080/api/users/register
     *
     * When deployed on Render, localhost means the user's
     * own computer.
     *
     * Using a relative URL makes the request go to:
     *
     * https://expense-tracker-app-ckop.onrender.com/api/users/register
     */

    const API_URL = "/api/users/register";


    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // Get username

                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                // Get email

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                // Get password

                const password =
                    document
                        .getElementById("password")
                        .value;


                // Get confirm password

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                // Message area

                const message =
                    document
                        .getElementById("message");


                /*
                 * Check whether passwords match
                 */

                if (password !== confirmPassword) {

                    message.textContent =
                        "❌ Passwords do not match";

                    message.style.color = "red";

                    return;
                }


                /*
                 * Send registration request
                 */

                try {

                    const response =
                        await fetch(
                            API_URL,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    username: username,

                                    email: email,

                                    password: password

                                })
                            }
                        );


                    /*
                     * Read response from Spring Boot
                     */

                    const result =
                        await response.text();


                    /*
                     * Registration successful
                     */

                    if (response.ok) {

                        message.textContent =
                            "✅ Registration successful!";

                        message.style.color =
                            "green";


                        /*
                         * Clear form
                         */

                        document
                            .getElementById(
                                "registerForm"
                            )
                            .reset();


                        /*
                         * Redirect to login page
                         */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1500
                        );

                    }


                    /*
                     * Registration failed
                     */

                    else {

                        message.textContent =
                            "❌ " + result;

                        message.style.color =
                            "red";

                    }

                }


                    /*
                     * Connection error
                     */

                catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    message.textContent =
                        "❌ Cannot connect to server";

                    message.style.color =
                        "red";

                }

            }
        );

</script>

</body>

</html>
